name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск (Actions → CI → Run workflow): проверка и деплой текущего main.
  workflow_dispatch:
  # Раз в месяц (решение автора) — только Trivy-гейт по образу, который в проде:
  # CVE публикуют каждый день, устранимая может появиться без наших коммитов.
  # Красный запуск — письмо от GitHub.
  schedule:
    - cron: "0 6 1 * *"

# Минимальные права: по умолчанию CI только читает код; build и deploy
# добавляют себе права на пакеты GHCR.
permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    # Конкретная версия, а не ubuntu-latest: ярлык latest GitHub переводит на новые
    # релизы сам, и окружение CI менялось бы без коммита в репозитории.
    runs-on: ubuntu-26.04
    env:
      # uv run падает, если uv.lock разошёлся с pyproject.toml.
      UV_LOCKED: "1"
    steps:
      # Actions закреплены по SHA: тег можно переписать, коммит — нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Зависимости
        run: uv sync --locked

      - name: Линтер и типы
        run: make lint

      # Датасет — для гейта сохранённых ответов (tests/test_saved_answers.py):
      # тексты рецептов в репозиторий не кладём, тест собирает их из CSV.
      - name: Датасет
        run: make .env && make data

      - name: Тесты
        env:
          # Без датасета гейт сохранённых ответов в CI — ошибка, а не пропуск.
          REQUIRE_DATASET: "1"
        run: make test

      - name: Проверка docker-compose.yml
        run: docker compose config -q

      - name: Правила алертов (promtool)
        run: make alerts-test

  # Образ ассистента собирается один раз — здесь — и уходит в GHCR с тегом
  # коммита. Сервер скачивает его же по digest и сам ничего не собирает: в проде
  # работает ровно то, что собрал (и проверил) CI.
  build:
    # PR из форка в GHCR писать не может: у его токена нет packages: write. По
    # расписанию образ не собирается: проверяется тот, что уже в проде.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GITHUB_TOKEN — встроенный: GitHub выдаёт его на каждую задачу, живёт до её
      # конца, права — из permissions выше. Вход — обычным docker login, без
      # сторонних actions.
      - name: Сборка образа и отправка в GHCR
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Имя в GHCR — только строчными: MichaelZhdanov → michaelzhdanov.
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # --pull: свежий базовый образ; кэша на раннере нет, apt-get upgrade
          # в Dockerfile ставит все вышедшие исправления Debian.
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$repo:$GITHUB_SHA" .
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --quiet "$repo:$GITHUB_SHA"
          # Digest — у самого реестра: дальше образ идёт только по нему.
          image="$repo@$(docker buildx imagetools inspect "$repo:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          docker logout ghcr.io
          echo "образ: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Trivy-гейт: устранимых HIGH и CRITICAL в проде быть не должно
  # (scripts/trivy_gate.py). Образ ассистента — тот, что собрала build и скачает
  # сервер; сторонние — по digest из compose. По расписанию build нет — образ
  # последнего коммита main, тот, что в проде.
  scan:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'schedule') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Образ ассистента из GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT: ${{ needs.build.outputs.image }}
        run: |
          image="${BUILT:-ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA}"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull --quiet "$image"
          docker logout ghcr.io
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Trivy — устранимых HIGH и CRITICAL в проде быть не должно
        run: uv run --no-project --python 3.14 scripts/trivy_gate.py --image "$IMAGE"

  # Деплой на сервер: только после зелёных проверки, сборки и Trivy, только push
  # в main и ручной запуск (в PR секретов нет). Вход root по ключу деплоя, см.
  # deploy/bootstrap.sh.
  deploy:
    needs: [check, build, scan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    environment: prod
    # Токен задачи — только читать пакеты: им сервер скачивает образ из GHCR.
    permissions:
      contents: read
      packages: read
    # Ключ снимка, если деплой пересобрал индекс: его выкладывает index-release.
    outputs:
      index_exported: ${{ steps.ssh.outputs.index_exported }}
    # Сборка полного индекса на сервере (только с ALLOW_INDEX_REBUILD) — около часа.
    timeout-minutes: 90
    # Деплои идут по очереди; новый push не обрывает начатый деплой посередине.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Деплой по SSH
        id: ssh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CLOUD_RU_API_KEY: ${{ secrets.CLOUD_RU_API_KEY }}
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ESCALATION_CHAT_ID: ${{ secrets.ESCALATION_CHAT_ID }}
          # Переменная Actions, не секрет: 1 — деплою можно пересобрать индекс
          # (≈ 200 ₽); 0 или не задана — нельзя, снимок грузит deploy/upload_index.sh.
          ALLOW_INDEX_REBUILD: ${{ vars.ALLOW_INDEX_REBUILD }}
          # Переменные Actions: домены HTTPS для Grafana и Grocy (Caddy на
          # сервере); не заданы оба — оба только по ssh-туннелю.
          GRAFANA_DOMAIN: ${{ vars.GRAFANA_DOMAIN }}
          GROCY_DOMAIN: ${{ vars.GROCY_DOMAIN }}
          IMAGE: ${{ needs.build.outputs.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Деплой не настроен: нет секрета DEPLOY_HOST в environment prod (README, «Деплой»)."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключ сервера не проверяется (решение автора): сервер может переезжать.
          server() {
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 "root@$DEPLOY_HOST" "$@"
          }
          # Сервер входит в GHCR токеном этой задачи: только чтение пакетов, живёт
          # до конца задачи; в stdin, а не в команде. deploy.sh в конце выходит.
          printf '%s' "$GITHUB_TOKEN" | server "docker login ghcr.io --username $GITHUB_ACTOR --password-stdin"
          # Сначала клон на сервере переходит на проверенный коммит, потом
          # запускается deploy.sh уже из него: так всегда работает новая версия
          # скрипта, даже если клон на сервере старый (или скрипта там ещё нет).
          remote="cd /opt/recipes-llm && git fetch --quiet origin main"
          remote="$remote && git checkout --quiet --detach $GITHUB_SHA"
          rebuild=""
          if [ "$ALLOW_INDEX_REBUILD" = "1" ]; then rebuild=" --rebuild-index"; fi
          remote="$remote && deploy/deploy.sh $GITHUB_SHA $IMAGE$rebuild"
          # Ключи API — в stdin, а не в команде: так их не видно в ps на
          # сервере. Незаданный в GitHub ключ не передаётся, и в .env на
          # сервере остаётся прежнее значение.
          {
            [ -z "$CLOUD_RU_API_KEY" ] || printf 'CLOUD_RU_API_KEY=%s\n' "$CLOUD_RU_API_KEY"
            [ -z "$GIGACHAT_API_KEY" ] || printf 'GIGACHAT_API_KEY=%s\n' "$GIGACHAT_API_KEY"
            [ -z "$ANTHROPIC_API_KEY" ] || printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
            [ -z "$TELEGRAM_BOT_TOKEN" ] || printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            [ -z "$ESCALATION_CHAT_ID" ] || printf 'ESCALATION_CHAT_ID=%s\n' "$ESCALATION_CHAT_ID"
            [ -z "$GRAFANA_DOMAIN" ] || printf 'GRAFANA_DOMAIN=%s\n' "$GRAFANA_DOMAIN"
            [ -z "$GROCY_DOMAIN" ] || printf 'GROCY_DOMAIN=%s\n' "$GROCY_DOMAIN"
          } | server "$remote"
          # Пересобранный индекс deploy.sh снял в index/, ключ — в index/exported.
          # Выкладывает задача index-release: у этой нет права писать в релизы.
          exported=$(server "cat /opt/recipes-llm/index/exported 2>/dev/null || true")
          echo "index_exported=$exported" >> "$GITHUB_OUTPUT"

  # Индекс, пересобранный деплоем на сервере (ALLOW_INDEX_REBUILD=1), — снимком в
  # релиз index (решение автора). Писать в релизы может только токен с contents:
  # write, поэтому выкладывает раннер: сервер такого токена не получает.
  index-release:
    needs: deploy
    if: needs.deploy.outputs.index_exported != ''
    runs-on: ubuntu-26.04
    environment: prod
    permissions:
      contents: write
    steps:
      - name: Снимок с сервера → релиз index
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: ${{ needs.deploy.outputs.index_exported }}
        run: |
          # Ключ и коллекция приходят с сервера: только ожидаемые символы.
          [[ "$KEY" =~ ^[a-z0-9-]+$ ]] || { echo "::error::ключ снимка не тот: $KEY"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no
                -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30)
          dir=/opt/recipes-llm/index
          scp "${opts[@]}" "root@$DEPLOY_HOST:$dir/$KEY.json" .
          collection=$(jq -r .collection "$KEY.json")
          [[ "$collection" =~ ^recipes-[0-9a-f]{12}$ ]] || { echo "::error::коллекция не та: $collection"; exit 1; }
          scp "${opts[@]}" "root@$DEPLOY_HOST:$dir/$collection.snapshot" "$KEY.snapshot"
          echo "$(jq -r .sha256 "$KEY.json")  $KEY.snapshot" | sha256sum --check -
          # Сначала снимок, потом json: json ссылается на снимок.
          gh release upload index "$KEY.snapshot" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload index "$KEY.json" --repo "$GITHUB_REPOSITORY" --clobber
          # $dir подставляется здесь, на раннере: так и задумано.
          # shellcheck disable=SC2029
          ssh "${opts[@]}" "root@$DEPLOY_HOST" "rm -f $dir/exported"
