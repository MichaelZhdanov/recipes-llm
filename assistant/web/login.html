<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Paperless Assistant</title>
  <link rel="stylesheet" href="/chat.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <header>
    <h1>Paperless Assistant</h1>
    <p>Ответы по документации и коду Paperless-ngx. Чтобы задать вопрос, войдите.</p>
  </header>
  <form id="login" class="login">
    <label>Логин <input id="user" name="login" autocomplete="username" required></label>
    <label>Пароль <input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="enter">Войти</button>
    <p id="error" class="message error" hidden></p>
  </form>
</body>
</html>
