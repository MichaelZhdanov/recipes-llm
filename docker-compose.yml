# Стек Recipes LLM. Запуск: make up (при первом запуске создаёт .env).
# Значения ${...} compose берёт из .env в этой папке.
# Порты опубликованы только на 127.0.0.1: стек не виден из локальной сети.
# Каждый сервис получает только свои переменные через environment, без env_file.
name: recipes-llm

services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # В образе нет curl и wget, поэтому запрос к /readyz отправляет сам bash через /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 3s
      retries: 5

  assistant:
    build: .
    restart: unless-stopped
    ports:
      # HTTP API (/health, /ask) только для этой машины; порт меняется в .env
      # (ASSISTANT_PORT), если 8080 занят.
      - "127.0.0.1:${ASSISTANT_PORT:-8080}:8080"
    # Все поля assistant/config.py. Пустое значение означает значение по умолчанию из config.py.
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      CLOUD_RU_API_KEY: ${CLOUD_RU_API_KEY:-}
      CLOUD_RU_API_URL: ${CLOUD_RU_API_URL:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_API_URL: ${VOYAGE_API_URL:-}
      # Адрес внутри docker-сети: единственная переменная ассистента не из .env.
      QDRANT_URL: http://qdrant:6333
      DATASET_REVISION: ${DATASET_REVISION:-}
      DATA_PATH: ${DATA_PATH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ESCALATION_CHAT_ID: ${ESCALATION_CHAT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-}

volumes:
  qdrant-data:
