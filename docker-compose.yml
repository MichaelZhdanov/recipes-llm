# Стек Recipes LLM. Запуск: make up (при первом запуске создаёт .env).
# Значения ${...} compose берёт из .env в этой папке.
# Порты опубликованы только на 127.0.0.1: стек не виден из локальной сети.
# Каждый сервис получает только свои переменные через environment, без env_file.
# Профили (COMPOSE_PROFILES в .env): api — HTTP API, bot — Telegram-бот; Qdrant —
# всегда. Локально по умолчанию api, на сервере deploy.sh включает только bot.
# Склад Grocy — отдельный compose-проект (deploy/grocy/, на сервере /opt/grocy):
# ассистент и бот видят его через внешнюю docker-сеть grocy.
name: recipes-llm

# Все поля assistant/config.py: API и бот — один и тот же ассистент. Пустое
# значение означает значение по умолчанию из config.py.
x-settings: &settings
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_EFFORT: ${LLM_EFFORT:-}
  ANSWER_MODE: ${ANSWER_MODE:-}
  ANSWER_REVIEW: ${ANSWER_REVIEW:-}
  GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
  GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-}
  GIGACHAT_API_URL: ${GIGACHAT_API_URL:-}
  GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_API_URL: ${ANTHROPIC_API_URL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-}
  CLOUD_RU_API_KEY: ${CLOUD_RU_API_KEY:-}
  CLOUD_RU_API_URL: ${CLOUD_RU_API_URL:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  VOYAGE_API_URL: ${VOYAGE_API_URL:-}
  # Адреса внутри docker-сети (здесь и GROCY_API_URL ниже) — не из .env.
  QDRANT_URL: http://qdrant:6333
  DATASET_REVISION: ${DATASET_REVISION:-}
  DATA_PATH: ${DATA_PATH:-}
  INDEX_SAMPLE: ${INDEX_SAMPLE:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  ESCALATION_CHAT_ID: ${ESCALATION_CHAT_ID:-}
  # Адрес Grocy внутри docker-сети; ключ — пользователя Grocy без прав.
  GROCY_API_URL: http://grocy/api
  GROCY_API_KEY: ${GROCY_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-}

services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # В образе нет curl и wget, поэтому запрос к /readyz отправляет сам bash через /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 3s
      retries: 5

  assistant:
    build: .
    profiles: [api]
    restart: unless-stopped
    ports:
      # HTTP API (/health, /ask) только для этой машины; порт меняется в .env
      # (ASSISTANT_PORT), если 8080 занят.
      - "127.0.0.1:${ASSISTANT_PORT:-8080}:8080"
    environment: *settings
    networks: [default, grocy]

  bot:
    build: .
    # Нужен TELEGRAM_BOT_TOKEN: без него бот сразу завершается.
    profiles: [bot]
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "assistant.bot"]
    environment: *settings
    networks: [default, grocy]
    volumes:
      # История диалогов, оценки и кэши (SQLite) переживают пересборку образа.
      - bot-data:/app/data/bot
    healthcheck:
      # Порта у бота нет: проверка — свежесть файла-сердцебиения (assistant/bot/health.py).
      test: ["CMD", "/app/.venv/bin/python", "-m", "assistant.bot.health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3

  grocy-seed:
    # Демо-склад, пользователь без прав и его ключ: make grocy-seed
    # (assistant/grocy/seed.py). Свой профиль: make up запускает его сам, когда
    # задан GROCY_DIR. Ключ кладёт в базу Grocy — в каталоге GROCY_DIR/config.
    build: .
    profiles: [grocy-seed]
    command: ["/app/.venv/bin/python", "-m", "assistant.grocy.seed"]
    environment:
      GROCY_URL: http://grocy
      GROCY_DB: /grocy/data/grocy.db
      GROCY_API_KEY: ${GROCY_API_KEY:-}
      GROCY_ADMIN_PASSWORD: ${GROCY_ADMIN_PASSWORD:-}
    volumes:
      - ${GROCY_DIR:-./data/grocy}/config:/grocy
    networks: [grocy]

volumes:
  qdrant-data:
  bot-data:

networks:
  # Общая сеть со складом Grocy (его compose — deploy/grocy/). Её создаёт make up.
  grocy:
    name: grocy
    external: true
