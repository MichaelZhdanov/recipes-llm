# Стек Recipes LLM. Запуск: make up (при первом запуске создаёт .env).
# Значения ${...} compose берёт из .env в этой папке.
# Порты опубликованы на 127.0.0.1; исключение — Caddy (профиль tls, ниже).
# Каждый сервис получает только свои переменные через environment, без env_file.
# Профили (COMPOSE_PROFILES в .env): api — HTTP API, bot — Telegram-бот,
# observability — Prometheus и Grafana, alerts — Alertmanager → Telegram,
# tls — Caddy с HTTPS для Grafana и Grocy, host — метрики самого сервера;
# Qdrant — всегда. Локально по умолчанию api, на сервере deploy.sh включает
# bot,observability,alerts,host и tls, если заданы домены.
# Публичные порты — только у Caddy (80, 443), остальные — на 127.0.0.1.
# Склад Grocy — отдельный compose-проект (deploy/grocy/, на сервере /opt/grocy):
# ассистент и бот видят его через внешнюю docker-сеть grocy.
name: recipes-llm

# Логи контейнеров: json-file по умолчанию не ограничен и съел бы диск сервера
# (журнал бота — строка на каждый вопрос). До 5 файлов по 10 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Все поля assistant/config.py: API и бот — один и тот же ассистент. Пустое
# значение означает значение по умолчанию из config.py.
x-settings: &settings
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_EFFORT: ${LLM_EFFORT:-}
  ANSWER_MODE: ${ANSWER_MODE:-}
  ANSWER_REVIEW: ${ANSWER_REVIEW:-}
  GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
  GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-}
  GIGACHAT_API_URL: ${GIGACHAT_API_URL:-}
  GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_API_URL: ${ANTHROPIC_API_URL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-}
  CLOUD_RU_API_KEY: ${CLOUD_RU_API_KEY:-}
  CLOUD_RU_API_URL: ${CLOUD_RU_API_URL:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  VOYAGE_API_URL: ${VOYAGE_API_URL:-}
  # Адреса внутри docker-сети (здесь и GROCY_API_URL ниже) — не из .env.
  QDRANT_URL: http://qdrant:6333
  DATASET_REVISION: ${DATASET_REVISION:-}
  DATA_PATH: ${DATA_PATH:-}
  INDEX_SAMPLE: ${INDEX_SAMPLE:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  ESCALATION_CHAT_ID: ${ESCALATION_CHAT_ID:-}
  # Адрес Grocy внутри docker-сети; ключ — пользователя Grocy без прав.
  GROCY_API_URL: http://grocy/api
  GROCY_API_KEY: ${GROCY_API_KEY:-}
  JOURNAL_KEY: ${JOURNAL_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-}

services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.20.0
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # В образе нет curl и wget, поэтому запрос к /readyz отправляет сам bash через /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 3s
      retries: 5

  assistant:
    build: .
    profiles: [api]
    restart: unless-stopped
    logging: *logging
    ports:
      # HTTP API (/health, /ask) только для этой машины; порт меняется в .env
      # (ASSISTANT_PORT), если 8080 занят.
      - "127.0.0.1:${ASSISTANT_PORT:-8080}:8080"
    environment: *settings
    networks: [default, grocy]

  bot:
    build: .
    # Нужен TELEGRAM_BOT_TOKEN: без него бот сразу завершается.
    profiles: [bot]
    restart: unless-stopped
    logging: *logging
    command: ["/app/.venv/bin/python", "-m", "assistant.bot"]
    environment: *settings
    networks: [default, grocy]
    volumes:
      # История диалогов, оценки и кэши (SQLite) переживают пересборку образа.
      - bot-data:/app/data/bot
    healthcheck:
      # Порта у бота нет: проверка — свежесть файла-сердцебиения (assistant/bot/health.py).
      test: ["CMD", "/app/.venv/bin/python", "-m", "assistant.bot.health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3

  grocy-seed:
    # Демо-склад, пользователь без прав и его ключ: make grocy-seed
    # (assistant/grocy/seed.py). Свой профиль: make up запускает его сам, когда
    # задан GROCY_DIR. Ключ кладёт в базу Grocy — в каталоге GROCY_DIR/config.
    build: .
    profiles: [grocy-seed]
    command: ["/app/.venv/bin/python", "-m", "assistant.grocy.seed"]
    environment:
      GROCY_URL: http://grocy
      GROCY_DB: /grocy/data/grocy.db
      GROCY_API_KEY: ${GROCY_API_KEY:-}
      GROCY_ADMIN_PASSWORD: ${GROCY_ADMIN_PASSWORD:-}
    volumes:
      - ${GROCY_DIR:-./data/grocy}/config:/grocy
    networks: [grocy]

  # --- Наблюдаемость (этап 8, F8) ---
  # Prometheus и Grafana — профиль observability (на сервере и локально,
  # решение 80); Alertmanager — профиль alerts, только на сервере: он пишет в
  # настоящую группу операторов (решение 81). Конфиги — observability/.
  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Хранить 15 дней: хватит увидеть неделю к неделе, диск — мегабайты.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # node_exporter слушает мост docker0 хоста: имя host.docker.internal — его адрес.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: docker.io/grafana/grafana:13.2.4
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    environment:
      # Пароль admin действует при первом запуске (пустая база Grafana);
      # генерирует scripts/init_env.py.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      # За Caddy (профиль tls) — свой адрес и cookie только по HTTPS; без
      # домена переменные пустые, и Grafana берёт свои значения по умолчанию.
      GF_SERVER_ROOT_URL: ${GRAFANA_DOMAIN:+https://${GRAFANA_DOMAIN}/}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_DOMAIN:+true}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # С этой машины; на сервере снаружи — https://GRAFANA_DOMAIN через Caddy.
      - "127.0.0.1:3000:3000"

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.1
    profiles: [alerts]
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    # Токен бота и id группы — файлами в /run/secrets, не в конфиге.
    secrets: [telegram_bot_token, escalation_chat_id]

  # --- Состояние самого сервера (профиль host, только на сервере) ---
  # node_exporter — как в его README: сеть и процессы хоста, корень хоста —
  # только на чтение; так видны CPU, память, диск и трафик сервера, а не
  # контейнера. В сети хоста он слушал бы 0.0.0.0:9100, а файрвола на сервере
  # нет: поэтому — только адрес моста docker0, из интернета он не виден.
  # Prometheus ходит туда через host-gateway (= docker0).
  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1
    profiles: [host]
    restart: unless-stopped
    logging: *logging
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.17.0.1:9100
    volumes:
      - /:/host:ro,rslave

  # Входы по SSH и баны fail2ban из логов сервера (assistant/hostlog.py) —
  # тот же образ, профиль host. Каталог логов хоста — только на чтение: файл
  # после ротации logrotate — новый inode, смонтированный файл остался бы старым.
  hostlog:
    build: .
    profiles: [host]
    restart: unless-stopped
    logging: *logging
    command: ["/app/.venv/bin/python", "-m", "assistant.hostlog"]
    # auth.log и fail2ban.log читает только группа adm (gid 4 в Ubuntu).
    group_add: ["4"]
    volumes:
      - /var/log:/host/log:ro

  # HTTPS для Grafana и Grocy (решение 82) — профиль tls, только на сервере и
  # только когда заданы оба домена (deploy.sh). Единственные публичные порты
  # стека: 80 — проверка домена Let's Encrypt и редирект, 443 — HTTPS.
  caddy:
    image: docker.io/library/caddy:2.11.7
    profiles: [tls]
    restart: unless-stopped
    logging: *logging
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-}
      GROCY_DOMAIN: ${GROCY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и ключи: переживают пересоздание контейнера.
      - caddy-data:/data
      - caddy-config:/config
    # Grocy — в своём compose-проекте, общая сеть grocy (как у бота).
    networks: [default, grocy]

volumes:
  qdrant-data:
  bot-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  caddy-data:
  caddy-config:

networks:
  # Общая сеть со складом Grocy (его compose — deploy/grocy/). Её создаёт make up.
  grocy:
    name: grocy
    external: true

secrets:
  # Для Alertmanager: compose берёт значения из переменных окружения (.env)
  # и кладёт файлами в /run/secrets контейнера.
  telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN
  escalation_chat_id:
    environment: ESCALATION_CHAT_ID
