# Эталонные кейсы changelog: ловушки устаревших записей истории изменений Paperless-ngx v3.4.2.
# В каждом кейсе есть ранняя запись docs/changelog.md (stale_line), которую позже отменили:
# функцию удалили, параметр переименовали или убрали, поведение по умолчанию поменяли.
# current_line — поздняя запись changelog или строка текущей документации с актуальным состоянием.
# must_not_include — устаревшее утверждение; ответ, который подаёт его как текущее, неверен.
# expected_sources — разделы с актуальным состоянием; для changelog это якорь раздела внутри версии
# (например docs/changelog.md#maintenance_44 — «paperless-ngx 1.12.0 > Maintenance»), а не якорь самой версии.

- id: changelog-001
  category: changelog
  role: user
  question: "Хочу развернуть paperless в Kubernetes. У проекта есть свой официальный Helm-чарт, который поддерживает команда?"
  expected_behavior: answer
  expected_sources:
    - docs/changelog.md#maintenance_44
  must_include: ["код Helm-чарта удалён из проекта"]
  must_not_include: ["Helm-чарт поддерживается командой проекта"]
  stale_line: docs/changelog.md:7245
  current_line: docs/changelog.md:7096
  notes: "В 1.10.2 команда взяла на себя чарт k8s-at-home («Take ownership of k8s-at-home Helm chart»), в 1.12.0 код чарта удалили («Chore: remove helm chart code»). В текущих docs/*.md Helm не упоминается."

- id: changelog-002
  category: changelog
  role: user
  question: "Можно сделать, чтобы сами файлы документов лежали на диске зашифрованными? Где-то читал про PAPERLESS_PASSPHRASE"
  expected_behavior: answer
  expected_sources:
    - docs/migration-v3.md#encryption-support
  must_include: ["шифрование документов и миниатюр больше не поддерживается", "до обновления расшифровать командой decrypt_documents"]
  must_not_include: ["шифрование файлов включается переменной PAPERLESS_PASSPHRASE"]
  stale_line: docs/changelog.md:9248
  current_line: docs/migration-v3.md:50
  notes: "Paperless 2.0.0 (исходный проект): «Encryption isn't gone… PAPERLESS_PASSPHRASE» (:9248-9249). paperless-ng 0.9.3: новые документы больше не шифруются, старые зашифрованные ещё работают (:8880). paperless-ngx 3.0.0: поддержку шифрования удалили (:1104), migration-v3.md:50-52 велит расшифровать документы перед обновлением. Опция --passphrase у экспортёра (administration.md) шифрует только поля экспорта, это не шифрование хранилища."

