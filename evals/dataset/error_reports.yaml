  must_not_include: []
  notes: "BarcodePlugin.detect: scan_pdf открывает файл через pikepdf, PasswordError ловится, пишется warning, список штрихкодов остаётся пустым. Значит, нет ни разделения, ни ASN, ни тегов из штрихкодов, а обработка продолжается как обычно."

- id: error_report-007
  category: error
  role: user
  question: "сканер без дуплекса, пользуюсь папкой double-sided. отсканировала нечётные, потом чётные, а в задачах ошибка: «back.pdf: This second file (even numbered pages) contains more pages than the first/odd numbered one. This means the two uploaded files don't belong to the same double-sided scan. Please retry, starting with the odd numbered pages again.» и оба файла куда-то пропали"
  expected_behavior: answer
  expected_line: src/documents/double_sided.py:98
  must_include: ["начать заново: сначала снова нечётные страницы, потом чётные", "в первом скане (нечётные) оказалось меньше страниц, чем во втором, например автоподатчик пропустил лист"]
  must_not_include: []
  notes: "CollatePlugin.run: чётные страницы вставляются через одну в staging-файл с нечётными; если во втором файле страниц больше, возникает IndexError и ConsumerError с этим текстом. В finally удаляются и staging-файл, и загруженный скан, поэтому оба файла «пропали». Нечётной частью мог стать и другой скан, загруженный в эту папку меньше чем за 30 минут до этого. Текст на строках 98–102, описание в docs/advanced_usage.md, раздел «Things that could go wrong»."

- id: error_report-008
  category: error
  role: user
  question: "почта перестала забираться, в логах каждые 10 минут одно и то же: [2026-11-04 08:10:02,417] [ERROR] [paperless_mail] Error while authenticating account Рабочая почта: b'[AUTHENTICATIONFAILED] Authentication failed.' пароль вроде никто не менял"
  expected_behavior: answer
  expected_line: src/paperless_mail/mail.py:245
  must_include: ["IMAP-сервер отклонил вход: проверить имя пользователя и пароль в настройках почтового аккаунта", "пока вход не проходит, правила этого аккаунта не обрабатываются"]
  must_not_include: []
  notes: "mailbox_login: вход по LOGIN (при пароле не в ASCII — AUTH=PLAIN через login_utf8, у OAuth-аккаунтов — XOAUTH2) бросил исключение. Оно логируется с ответом сервера и превращается в MailError «Error while authenticating account …» (строка 249), обработка аккаунта на этом заканчивается. Задача почты по умолчанию запускается раз в 10 минут (PAPERLESS_EMAIL_TASK_CRON)."

