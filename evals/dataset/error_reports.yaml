# Кейсы error_report для оценки разбора ошибок ассистентом по Paperless-ngx v3.4.2.
# Пользователь присылает строку лога, ошибку задачи из интерфейса или пересказ ошибки.
# expected_line — путь:строка от корня репозитория, где в коде задаётся текст этой ошибки.
# Если сообщение собрано из нескольких строк литерала, указана первая строка, диапазон — в notes.
# Ошибки, которые consumer оборачивает в «Error occurred while consuming document …»
# (src/documents/consumer.py:579), привязаны к месту исходного текста, а не к обёртке.

- id: error_report-001
  category: error
  role: user
  question: "Загружаю скан, на нём наклейка со штрихкодом ASN. В задачах красная ошибка: «scan_2026-11-03_0042.pdf: Not consuming scan_2026-11-03_0042.pdf: Given ASN 1234 already exists!» Документ так и не появился. Что не так?"
  expected_behavior: answer
  expected_line: src/documents/consumer.py:1169
  must_include: ["ASN 1234 уже присвоен другому документу, в том числе документу в корзине", "сменить или убрать ASN у существующего документа либо использовать новый номер"]
  must_not_include: []
  notes: "AsnCheckPlugin.pre_check_asn_value: номер ASN из штрихкода или из параметров загрузки уже есть у документа в базе. Проверка идёт по Document.global_objects, то есть с учётом корзины; тогда к сообщению добавляется «Note: existing document is in the trash.». Обработка прерывается до разбора файла."

- id: error_report-002
  category: error
  role: user
  question: "после переезда на новый сервер документы из папки consume не добавляются, в логе такое: [2026-11-04 09:12:44,031] [ERROR] [paperless.consumer] [a91c03e7] The following error occurred while storing document scan_0012.pdf after parsing: [Errno 13] Permission denied: '/usr/src/paperless/consume/scan_0012.pdf' помогите"
  expected_behavior: answer
  expected_line: src/documents/consumer.py:800
  must_include: ["у Paperless нет прав удалить исходный файл из папки consume", "задать USERMAP_UID и USERMAP_GID как у пользователя хоста, которому принадлежит папка"]
  must_not_include: []
  notes: "Разбор прошёл, ошибка на этапе сохранения: после записи в базу ConsumerPlugin удаляет оригинал из consume (input_doc.original_file.unlink(), строка 778), а пользователю внутри контейнера не хватает прав на каталог. Исключение ловит общий except вокруг сохранения и превращает в _fail. Текст на строках 800–801. В docs/troubleshooting.md раздел «Permission denied errors in the consumption directory»."

- id: error_report-003
  category: error
  role: engineer
  question: "Подключили PAPERLESS_PRE_CONSUME_SCRIPT для предобработки сканов, теперь падает каждый документ: `[2026-11-04 11:02:17,554] [ERROR] [paperless.consumer] [5be0d4a2] Error while executing pre-consume script: Command '['/usr/src/paperless/scripts/pre-consume.sh']' returned non-zero exit status 1.` Где это обрабатывается и куда смотреть дальше?"
  expected_behavior: answer
  expected_line: src/documents/consumer.py:331
  must_include: ["скрипт вернул ненулевой код выхода, и обработка документа прерывается", "stdout и stderr скрипта пишутся в лог построчно перед этой ошибкой"]
  must_not_include: []
  notes: "ConsumerPlugin.run_pre_consume_script: run_subprocess (src/documents/utils.py:159) логирует код выхода и вывод скрипта, затем вызывает check_returncode(). CalledProcessError ловится и превращается в _fail. Если файла скрипта нет, ошибка другая: «Configured pre-consume script … does not exist.» (строки 305–306)."

- id: error_report-004
  category: error
  role: user
  question: "кидаю картинку png, задача обработки падает. в ошибке что-то про DPI, мол в картинке нет информации о DPI и архивный pdf из неё сделать нельзя. что делать?"
  expected_behavior: answer
  expected_line: src/paperless/parsers/tesseract.py:343
  must_include: ["задать PAPERLESS_OCR_IMAGE_DPI — DPI, с которым сделано изображение"]
  must_not_include: []
  notes: "TesseractParser.construct_ocrmypdf_parameters: для картинки DPI берётся из её метаданных (get_dpi), затем из PAPERLESS_OCR_IMAGE_DPI, затем оценивается по ширине под A4 (calculate_a4_dpi). Если не получилось ни одно, поднимается ParseError «Cannot produce archive PDF for image …, no DPI information is present in this image and OCR_IMAGE_DPI is not set.» Текст на строках 343–345. Перед ней в логе обычно предупреждение «Error while getting DPI from image …» (строка 212)."

- id: error_report-005
  category: error
  role: engineer
  question: "Часть PDF от одного контрагента не проходит. В логе воркера: `[2026-11-03 16:40:09,218] [WARNING] [paperless.parsing.tesseract] [c07e5f19] Ghostscript PDF/A rendering failed, consider setting PAPERLESS_OCR_USER_ARGS: '{\"continue_on_soft_render_error\": true}'`, а следом ERROR по этому же файлу. Откуда это и чем грозит включение этого параметра?"
  expected_behavior: answer
  expected_line: src/paperless/parsers/tesseract.py:482
  must_include: ["Ghostscript не смог построить PDF/A, OCRmyPDF прервал обработку", "PAPERLESS_OCR_USER_ARGS с continue_on_soft_render_error: true заставляет продолжить, но архивная копия может отличаться от оригинала"]
  must_not_include: []
  notes: "_handle_subprocess_output_error (строки 474–488): на SubprocessOutputError от OCRmyPDF с «Ghostscript PDF/A rendering» в тексте пишет это предупреждение (482–484) и поднимает ParseError «SubprocessOutputError: … See logs for more information.» (строка 487). В docs/troubleshooting.md раздел «Consumption fails with \"Ghostscript PDF/A rendering failed\"»."

- id: error_report-006
  category: error
  role: user
  question: "включили разделение по штрихкодам, всё делится, кроме выписок из банка — они приходят с паролем и заходят одним документом. в логе мелькает предупреждение, что файл вроде как запаролен и штрихкоды не проверяются. это можно обойти?"
  expected_behavior: answer
  expected_line: src/documents/barcodes.py:296
