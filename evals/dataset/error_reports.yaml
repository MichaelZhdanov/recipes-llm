  category: error
  role: user
  question: "настроила правило почты на папку со счетами, ничего не приходит. в логе: [2026-11-04 08:20:03,902] [ERROR] [paperless_mail] Rule Рабочая почта.Счета: Error while processing rule: Rule Рабочая почта.Счета: Folder INBOX/Счета does not exist in account Рабочая почта. но папка точно есть, я её вижу в почте!"
  expected_behavior: answer
  expected_line: src/paperless_mail/mail.py:782
  must_include: ["разделитель подпапок зависит от почтового сервера: «.», «/» или «|», попробовать, например, INBOX.Счета", "Paperless пишет в лог список папок аккаунта строками «Located folder: …»"]
  must_not_include: []
  notes: "MailAccountHandler._handle_mail_rule: M.folder.set(folder) бросил MailboxFolderSelectError. Перед ошибкой Paperless пишет в лог «Unable to access folder …» (строка 770) и перечисляет найденные папки. Если действие правила — Move, проверяется и папка назначения, и ошибка может быть про неё. Внешняя обёртка «Error while processing rule» — строка 735. Текст на строках 782–783, совет про разделитель — в docs/usage.md, в заметке к правилам почты."

- id: error_report-010
  category: error
  role: engineer
  question: "Переносим Paperless на новый сервер через экспорт и импорт. Импорт падает сразу: `$ docker compose exec webserver document_importer ../export` → `CommandError: No passphrase was given, but this export contains encrypted fields`. Что это значит и где импортёр это проверяет?"
  expected_behavior: answer
  expected_line: src/documents/management/commands/document_importer.py:305
  must_include: ["экспорт сделан с --passphrase, импорт нужно запустить с тем же --passphrase"]
  must_not_include: []
  notes: "Command.load_metadata: в metadata.json экспорта есть параметры шифрования (EXPORTER_CRYPTO_SETTINGS_NAME), а --passphrase не передан. Проверка идёт до загрузки данных в базу. Флаг описан в docs/administration.md: экспортёр с --passphrase шифрует часть полей, импортёру нужен тот же пароль."

