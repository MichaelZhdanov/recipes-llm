  role: engineer
  question: "Можно ли ограничить, сколько места на диске занимают документы каждого пользователя, например квотой 5 ГБ?"
  expected_behavior: abstain
  expected_sources: []
  must_include: []
  must_not_include: ["PAPERLESS_USER_QUOTA", "PAPERLESS_STORAGE_QUOTA"]
  notes: "Почти по теме: квот нет. Искал в docs и src: quota, storage limit, disk quota, disk usage, per user limit/space/storage — совпадений нет. Права пользователей (docs/usage.md#permissions) ограничивают доступ к объектам, но не объём."

