  category: out_of_scope
  role: user
  question: "переезжаю с эвернота, там тыщи заметок с вложениями. как их импортнуть в paperless одним махом?"
  expected_behavior: abstain
  expected_sources: []
  must_include: []
  must_not_include: []
  notes: "Почти по теме: импорта из Evernote нет. Искал в docs и src: evernote, enex, onenote, import from — совпадений нет. document_importer принимает только экспорт самого Paperless (docs/administration.md#importer), раздел миграции описывает переход только с paperless, paperless-ng и образа LinuxServer."

- id: holdout-013
  category: out_of_scope
  role: engineer
  question: "Подписывает ли paperless тело webhook-запроса из воркфлоу HMAC-подписью, как X-Hub-Signature у GitHub, чтобы наш сервис мог проверить отправителя?"
  expected_behavior: abstain
  expected_sources: []
  must_include: []
  must_not_include: ["X-Paperless-Signature", "PAPERLESS_WEBHOOK_SECRET"]
  notes: "Почти по теме: подписи вебхуков нет. Искал в docs: webhook…sign/hmac/secret/verify — совпадений нет; в src hmac встречается только в подписи файла классификатора, signed_pickle для Celery и PBKDF2HMAC шифрования экспорта. Модель WorkflowActionWebhook (src/documents/models.py) хранит url, use_params, as_json, params, body, headers, include_document — секрета для подписи нет, src/documents/workflows/webhooks.py ничего не подписывает. Допустимо предложить статический заголовок из docs/usage.md#workflow-action-webhook, но как обходной путь, а не как HMAC."

