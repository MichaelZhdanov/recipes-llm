# Отложенная выборка для итоговой оценки ассистента по Paperless-ngx v3.4.2.
# Смотреть один раз, в конце: на этих кейсах ничего не настраивать.
# howto и config: expected_sources — идентификаторы разделов, любой из них годится как источник ответа.
# out_of_scope: ответа нет ни в docs/*.md (включая changelog.md), ни в src/; в notes перечислено, что искалось.

- id: holdout-001
  category: howto
  role: user
  question: "У сканера автоподатчик сканирует только одну сторону листа. Как отсканировать пачку двусторонних документов, чтобы paperless сам собрал страницы в правильном порядке?"
  expected_behavior: answer
  expected_sources:
    - docs/advanced_usage.md#collate
    - docs/advanced_usage.md#usage-example
    - docs/configuration.md#PAPERLESS_CONSUMER_ENABLE_COLLATE_DOUBLE_SIDED
  must_include: ["PAPERLESS_CONSUMER_ENABLE_COLLATE_DOUBLE_SIDED", "подпапка double-sided в папке consume", "сначала нечётные страницы, затем перевёрнутая пачка"]
  must_not_include: []
  notes: "Склейка двух односторонних сканов в один документ; функция выключена по умолчанию, требует PAPERLESS_CONSUMER_RECURSIVE, подпапку нужно создать самому."

- id: holdout-002
  category: howto
  role: user
  question: "Как включить вход с одноразовым кодом из Google Authenticator для своей учётной записи?"
  expected_behavior: answer
  expected_sources:
    - docs/usage.md#two-factor-authentication
  must_include: ["в диалоге My Profile", "10 кодов восстановления"]
  must_not_include: []
  notes: "2FA включает сам пользователь в My Profile по QR-коду; после включения выдаются 10 кодов восстановления, потерянную 2FA может отключить суперпользователь."

- id: holdout-003
  category: howto
  role: user
  question: "хочу чтобы у каждого счёта отдельно хранились сумма и номер договора. как добавить такие поля к документам?"
  expected_behavior: answer
  expected_sources:
    - docs/usage.md#custom-fields
  must_include: ["custom field создаётся в разделе Manage", "тип Monetary для суммы", "тип поля нельзя изменить после создания"]
  must_not_include: []
  notes: "Пользовательские поля: создать поле с типом данных, добавить его на странице документа через меню Custom Fields и сохранить документ."

- id: holdout-004
  category: howto
  role: user
  question: "К части документов я писал заметки со словом «гарантия», но обычный поиск их не находит. Как искать по тексту заметок?"
  expected_behavior: answer
  expected_sources:
    - docs/usage.md#searching-notes
    - docs/usage.md#document-searches
  must_include: ["notes.note:", "обычный поиск без имени поля заметки не просматривает"]
  must_not_include: []
  notes: "Заметки есть в полнотекстовом индексе, но ищутся только расширенным синтаксисом с именем поля: notes.note:гарантия или notes:гарантия."

- id: holdout-005
  category: howto
  role: engineer
  question: "Пишем скрипт, который загружает PDF в paperless через REST API. Какой эндпоинт вызывать и как потом узнать, создался ли документ?"
  expected_behavior: answer
  expected_sources:
    - docs/api.md#file-uploads
    - docs/usage.md#rest-api
  must_include: ["POST /api/documents/post_document/", "в ответ приходит UUID задачи", "/api/tasks/?task_id="]
  must_not_include: []
  notes: "Файл передаётся в поле формы document; эндпоинт сразу отвечает 200 с UUID задачи, а статус и id созданного документа видны в /api/tasks/?task_id=<uuid>."

- id: holdout-006
  category: howto
  role: engineer
  question: "Добавили новому корреспонденту правило сопоставления. Как применить его к нескольким сотням уже загруженных документов?"
  expected_behavior: answer
  expected_sources:
    - docs/administration.md#retagger
  must_include: ["document_retagger", "флаг -c (--correspondent)"]
  must_not_include: []
  notes: "document_retagger прогоняет сопоставление по существующим документам; без флагов -c/-T/-t/-s ничего не делает, -f перезаписывает уже назначенные значения."

- id: holdout-007
  category: config
  role: user
  question: "Во всех моих документах есть моя дата рождения, и paperless постоянно ставит её датой создания. Можно запретить ему брать эту дату?"
  expected_behavior: answer
  expected_sources:
    - docs/configuration.md#PAPERLESS_IGNORE_DATES
  must_include: ["PAPERLESS_IGNORE_DATES", "даты через запятую"]
  must_not_include: []
  notes: "Настройка задаёт список дат, которые не используются при определении даты создания; пример из документации — как раз дата рождения."

- id: holdout-008
  category: config
  role: engineer
  question: "Хотим открыть paperless по адресу https://example.com/paperless, а не на отдельном поддомене. Что нужно настроить?"
  expected_behavior: answer
  expected_sources:
    - docs/configuration.md#PAPERLESS_FORCE_SCRIPT_NAME
    - docs/configuration.md#PAPERLESS_STATIC_URL
    - docs/configuration.md#PAPERLESS_URL
  must_include: ["PAPERLESS_FORCE_SCRIPT_NAME=/paperless без слэша в конце", "PAPERLESS_URL не может содержать путь"]
  must_not_include: []
  notes: "Размещение под подпутём задаётся PAPERLESS_FORCE_SCRIPT_NAME; PAPERLESS_URL указывается без пути даже в этом случае, PAPERLESS_STATIC_URL при необходимости меняется со слэшем в конце."

- id: holdout-009
  category: config
  role: engineer
  question: "Партнёры присылают договоры в .docx и .xlsx. Как включить в paperless обработку офисных файлов?"
  expected_behavior: answer
  expected_sources:
    - docs/configuration.md#tika
    - docs/configuration.md#PAPERLESS_TIKA_ENABLED
    - docs/faq.md#what-file-types-does-paperless-ngx-support
  must_include: ["PAPERLESS_TIKA_ENABLED", "серверы Tika и Gotenberg", "PAPERLESS_TIKA_GOTENBERG_ENDPOINT"]
  must_not_include: []
  notes: "Офисные форматы поддерживаются только через Tika и Gotenberg: поднять оба сервиса, указать их адреса и включить парсер; в Docker есть пример docker-compose.sqlite-tika.yml."

- id: holdout-010
  category: config
  role: user
  question: "Можно ли вместо надписи «Paperless-ngx» показывать в интерфейсе название нашей фирмы и её логотип?"
  expected_behavior: answer
  expected_sources:
    - docs/configuration.md#PAPERLESS_APP_TITLE
    - docs/configuration.md#PAPERLESS_APP_LOGO
  must_include: ["PAPERLESS_APP_TITLE", "PAPERLESS_APP_LOGO", "логотип в каталоге /media/logo"]
  must_not_include: []
  notes: "Название меняет PAPERLESS_APP_TITLE, логотип — PAPERLESS_APP_LOGO (файл в /media/logo, в имени должно быть logo); логотип виден всем на странице входа."

