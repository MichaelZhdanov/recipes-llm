# Канарейки для судьи опоры на рецепт: 12 подтверждённых и 12 неподтверждённых.
# quote — дословные строки одного настоящего рецепта, числа из утверждения в них
# есть, так что проверка кодом все канарейки пропускает. Неподтверждённые
# расходятся со строками по смыслу: выдуманный шаг или время, обобщение сильнее
# данных, «без X» при X в строках, другой рецепт, совет без опоры, перепутанные
# количества, подмена ингредиента. Подтверждённые — пересказ своими словами.

# --- подтверждённые ---

- id: canary-001
  statement: "Для блинов «Ставьте чайник!» нужно 200 мл молока, 150 мл воды и одно яйцо."
  quote: "Блины \"Ставьте чайник!\"\nМолоко — 200 мл\nЯйцо куриное — 1 шт\nВода — 150 мл"
  supported: true
  notes: "https://www.povarenok.ru/recipes/show/159764/ — все три количества есть в строках, «одно яйцо» = «1 шт»."

