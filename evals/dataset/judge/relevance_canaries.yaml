# Канарейки для судьи релевантности: настоящие рецепты из датасета,
# 4 подходящих и 4 неподходящих. Неподходящие — тонко: название звучит уместно,
# а мешает один ингредиент или сам тип блюда. Судья, который не отличает их
# от подходящих, ненадёжен.

- id: relevance-001
  question: "Хочется чего-нибудь к чаю"
  name: "Шарлотка"
  ingredients: [яйцо куриное, сахар, мука пшеничная, яблоко]
  relevant: true
  notes: "Сладкий яблочный пирог — классика к чаю. https://www.povarenok.ru/recipes/show/34808/"

- id: relevance-002
  question: "Постное на ужин"
  name: "Овощное рагу"
  ingredients: [картофель, кабачок, капуста белокочанная, лук репчатый, томатная паста]
  relevant: true
  notes: "Только овощи и томатная паста: ни мяса, ни молочного, ни яиц, сытно для ужина. https://www.povarenok.ru/recipes/show/27311/"

- id: relevance-003
  question: "что приготовить на скорую руку"
  name: "Мгновенная жареная картошка"
  ingredients: [картофель, лук репчатый, соль, масло оливковое, масло подсолнечное]
  relevant: true
  notes: "Пять ингредиентов, жарка на сковороде — быстро. https://www.povarenok.ru/recipes/show/147445/"

- id: relevance-004
  question: "Едем на пикник, что взять поесть?"
  name: "Шашлык свиной в квасе"
  ingredients: [свинина, квас, лук репчатый, соевый соус, перец черный, перец чили]
  relevant: true
  notes: "Шашлык — главное блюдо пикника, мясо маринуют дома и везут с собой. https://www.povarenok.ru/recipes/show/107614/"

- id: relevance-005
  question: "Постное на ужин"
  name: 'Картофельное пюре по-ирландски "Чамп"'
  ingredients: [картофель, лук зеленый, молоко, масло сливочное, соль, перец черный]
  relevant: false
  notes: "Похоже на простой овощной гарнир, но молоко и сливочное масло в пост нельзя. https://www.povarenok.ru/recipes/show/36923/"

- id: relevance-006
  question: "Хочется чего-нибудь к чаю"
  name: "Пирог с мясом и картошкой"
