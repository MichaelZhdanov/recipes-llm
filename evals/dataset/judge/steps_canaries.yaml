# Канарейки для проверки шагов приготовления, написанных ИИ: 12 шагов, которые
# можно показать, и 12, которые нельзя. Рецепт — название и все строки
# настоящего рецепта из датасета. В каждой отклонённой ровно одна ошибка
# (по две на правило): лишний ингредиент или выдуманное количество масла,
# количество против строки, выдуманные время или температура, неиспользованная
# строка, опасный шаг, противоречие названию или нелепый порядок. В каждой
# одобренной есть место, которое легко принять за ошибку: соль, перец, масло
# «по вкусу» без строки, время из названия, часть количества с остатком,
# количество словами, признаки готовности, вода для варки, эмодзи.

# --- одобренные ---

- id: steps-001
  recipe: "Оладьи \"Пышики\"\nКефир — 0,5 л\nСахар — 2 ст. л.\nСоль\nСода — 1 ч. л.\nМука пшеничная — 2,5 стак.\nМасло растительное"
  steps: "1. Кефир — все поллитра — вылейте в кастрюльку и чуть подогрейте, чтобы был не ледяной.\n2. Всыпьте сахар, соду и соль по вкусу, размешайте. Кефир запенится — так и надо 👌\n3. Муку подсыпайте частями и мешайте венчиком, пока не уйдёт вся: тесто выйдет густое, как сметана.\n4. Разогрейте сковородку с растительным маслом.\n5. Выкладывайте тесто ложкой и жарьте на среднем огне, пока низ не подрумянится, потом переворачивайте.\n6. Оладушки готовы, когда с обеих сторон румяные, а внутри пышные и пропеклись 😋"
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/132953/ — «поллитра» = «0,5 л»; соль и масло без количества, как в строках; готовность по признакам, без минут; разговорный стиль и эмодзи допустимы. Все строки использованы, лишнего нет — одобрить."

- id: steps-002
  recipe: "Салат \"Нур\"\nФасоль консервированная — 1 бан.\nЯйцо куриное — 4 шт\nОгурец — 2 шт\nЛистья салата — 1 шт\nМайонез\nСоль — по вкусу\nПерец черный — по вкусу"
  steps: "1. Четыре яйца залейте холодной водой, сварите вкрутую, остудите и очистите.\n2. С фасоли слейте жидкость, фасоль промойте и обсушите.\n3. Пару огурцов нарежьте тонкой соломкой, яйца — кубиками.\n4. Листья салата вымойте, обсушите и порвите руками.\n5. Соедините фасоль, огурцы, яйца и салат, заправьте майонезом.\n6. Посолите и поперчите по вкусу, аккуратно перемешайте."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/32659/ — вода для варки яиц и промывания без строки — можно; «пару огурцов» = «2 шт»; яйца вкрутую. Все строки использованы — одобрить."

- id: steps-003
  recipe: "Куриные котлеты быстрого приготовления\nФиле куриное — 600 г\nЛук репчатый — 2 шт\nСырок плавленый — 1 шт\nПриправа"
  steps: "1. Куриное филе и обе луковицы пропустите через мясорубку.\n2. Плавленый сырок натрите на мелкой тёрке и добавьте в фарш.\n3. Добавьте приправу, при желании посолите по вкусу и хорошо вымешайте фарш.\n4. Разогрейте сковороду с небольшим количеством растительного масла.\n5. Сформируйте небольшие котлеты и обжарьте с двух сторон до румяной корочки.\n6. Убавьте огонь, накройте крышкой и доведите котлеты до полной готовности: на разрезе фарш белый, сок прозрачный."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/102144/ — масло для жарки и соль без количества, которых нет в строках, — можно; куриный фарш до полной готовности; «обе луковицы» = «2 шт». Одобрить."

- id: steps-004
  recipe: "Кисель калиновый\nКалина — 200-250 г\nСахар — 200 г\nКрахмал картофельный — 4 ст. л.\nВода — 1,5 л"
  steps: "1. Калину переберите и промойте.\n2. Разомните ягоды толкушкой и отожмите сок через марлю, сок уберите в холодильник.\n3. Отлейте стакан холодной воды — он понадобится для крахмала.\n4. Остальной водой залейте ягодный жмых, доведите до кипения и процедите.\n5. Всыпьте в отвар сахар и размешайте, пока он не растворится.\n6. Крахмал разведите в отложенной холодной воде и тонкой струйкой влейте в кипящий отвар, непрерывно помешивая.\n7. Как только кисель загустеет и снова закипит, снимите его с огня и влейте калиновый сок."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/17772/ — часть количества с остатком: стакан воды отложен для крахмала, остальная вода — в отвар; готовность по признакам («загустеет»), без минут. Одобрить."

- id: steps-005
  recipe: "Смузи \"Солнечное утро\"\nАпельсин — 1 шт\nНектарин — 2 шт\nИмбирь — 1\\4 ч. л.\nХлопья злаковые — 3 ст. л.\nЙогурт — 200 г"
  steps: "1. Апельсин почистите и разберите на дольки 🍊\n2. С пары спелых нектаринов снимите косточки, мякоть порежьте кусочками.\n3. Закиньте фрукты в блендер, добавьте йогурт и четверть чайной ложки имбиря.\n4. Сверху — 3 столовые ложки хлопьев, с ними смузи сытнее.\n5. Взбивайте, пока не станет гладким и нежным ☀️\n6. Разлейте по стаканам — бодрое солнечное утро готово!"
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/113671/ — эмодзи и эпитеты допустимы; «пару нектаринов» = «2 шт», «четверть чайной ложки» = «1\\4 ч. л.»; все строки использованы. Одобрить."

- id: steps-006
  recipe: "Сырные лепешки за 10 минут\nСыр твердый — 100 г\nСметана — 200 г\nСоль — 1 щепот.\nСода — 0.25 ч. л.\nМука пшеничная — 100 г\nОрегано — 1 ч. л."
  steps: "1. Сыр натрите на мелкой тёрке.\n2. В сметану всыпьте соду и щепотку соли, перемешайте.\n3. Добавьте тёртый сыр, чайную ложку орегано и муку, замесите мягкое тесто.\n4. Разделите тесто на несколько частей и раскатайте тонкие лепёшки.\n5. Обжарьте лепёшки на разогретой сухой сковороде с двух сторон до золотистых пятнышек.\n6. Весь рецепт укладывается в обещанные 10 минут — подавайте лепёшки тёплыми."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/155697/ — время «10 минут» есть в названии — его можно назвать; «щепотку соли» = «1 щепот.». Одобрить."

- id: steps-007
  recipe: "Запеченные куриные голени\nСпеции — по вкусу\nМайонез — 2 ст. л.\nЧеснок — 3 зуб.\nСоевый соус — 3 ст. л.\nГолень куриная — 1 кг\nЯйцо куриное — 1 шт"
  steps: "1. Голени обсушите бумажным полотенцем.\n2. Три зубчика чеснока пропустите через пресс.\n3. Смешайте майонез, соевый соус, яйцо, чеснок и специи по вкусу.\n4. Обмажьте голени маринадом со всех сторон и уберите в холодильник мариноваться.\n5. Выложите голени в форму одним слоем.\n6. Запекайте в разогретой духовке до румяной корочки и полной готовности: при проколе у кости сок должен быть прозрачным, без розового."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/84428/ — птица до полной готовности по признакам; духовка «разогретая», без температуры и минут; «Запеченные» — в духовке. Одобрить."

- id: steps-008
  recipe: "Рыбный салат за 25 минут\nХек — 300 г\nЯйцо куриное — 3 шт\nМорковь — 1 шт\nЛук репчатый — 2 шт\nМайонез — по вкусу\nСыр твердый — 70 г\nСпеции — по вкусу"
  steps: "1. Хек отварите в подсоленной воде, пока мясо не побелеет и не станет легко отходить от кости.\n2. Одновременно в другой кастрюле сварите вкрутую 3 яйца и отварите морковь до мягкости.\n3. Рыбу остудите, удалите кости и разберите на кусочки; яйца и морковь остудите и очистите.\n4. Две луковицы мелко нарежьте, яйца и морковь натрите на крупной тёрке, сыр — на мелкой.\n5. Выложите слоями рыбу, лук, морковь и яйца, промазывая каждый слой майонезом и приправляя специями по вкусу.\n6. Сверху посыпьте сыром — если варить всё параллельно, салат будет готов как раз за 25 минут."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/138036/ — «25 минут» — из названия; вода для варки и соль в воде без количества — можно; рыба до готовности, яйца вкрутую. Одобрить."

- id: steps-009
  recipe: "Печенье апельсиновое\nМасло сливочное — 170 г\nСахар — 160 г\nМука кукурузная — 140 г\nМука пшеничная — 75 г\nЯйцо куриное — 2 шт\nЦедра апельсина — 3 шт"
  steps: "1. Мягкое сливочное масло взбейте с половиной сахара до пышности.\n2. Вбейте оба яйца по одному, затем всыпьте остальной сахар и взбейте ещё раз.\n3. Добавьте цедру трёх апельсинов.\n4. Смешайте кукурузную и пшеничную муку и вмешайте в масляную массу до мягкого теста.\n5. Выкладывайте тесто ложкой на противень с пергаментом, оставляя между печеньями место.\n6. Выпекайте в разогретой духовке, пока края печенья не зарумянятся."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/55079/ — часть количества с остатком: половина сахара, затем остальной; «оба яйца» = «2 шт», «цедру трёх апельсинов» = «3 шт»; готовность по признакам. Одобрить."

- id: steps-010
  recipe: "Шарлотка в горшочке\nЯблоко — 1 шт\nЯйцо куриное — 2 шт\nСахар — 100 г\nМука пшеничная — 100 г\nЦедра апельсина — 1 ч. л."
  steps: "1. Пару яиц взбейте с сахаром добела — чем пышнее, тем нежнее шарлотка 🙂\n2. Вмешайте муку и чайную ложку апельсиновой цедры.\n3. Яблоко очистите от сердцевины и порежьте дольками.\n4. Горшочек смажьте маслом, выложите яблоко и залейте тестом.\n5. Ставьте горшочек в разогретую духовку и пеките до румяной верхушки.\n6. Проткните деревянной шпажкой: вышла сухой — шарлотка готова 🍎"
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/137236/ — «пару яиц» = «2 шт»; масло для смазывания без строки и без количества — можно; готовность по шпажке, без минут и градусов. Одобрить."

- id: steps-011
  recipe: "Суп из плавленого сырка\nСыр плавленый — 100 г\nКартофель — 4 шт\nРис — 3 ст. л.\nМорковь — 1 шт\nЛук репчатый — 1 шт\nСоль — 3/4 ст. л.\nВода — 2,5 л\nМасло растительное — 1 ст. л."
  steps: "1. Вскипятите 2,5 л воды.\n2. Рис промойте и опустите в кипящую воду.\n3. Картофель очистите, нарежьте кубиками и добавьте в кастрюлю.\n4. Лук и морковь мелко нарежьте и обжарьте на столовой ложке растительного масла до мягкости.\n5. Когда картофель станет мягким, переложите в суп зажарку и плавленый сыр кусочками.\n6. Помешивайте, пока сыр полностью не растворится, посолите (3/4 ст. л.), по желанию поперчите и снимите с огня."
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/133800/ — готовность по признакам вместо минут; количества совпадают со строками; перец сверх строк, без количества — можно. Одобрить."

- id: steps-012
  recipe: "Курица в ананасах\nГрудка куриная — 800 г\nАнанас — 1 бан.\nКукуруза — 1 бан.\nМайонез"
  steps: "1. Грудку порежьте пластами, слегка отбейте, посолите и поперчите по вкусу.\n2. Форму смажьте маслом и выложите курицу одним слоем.\n3. Ананасы из банки — сверху, сироп слейте, он не понадобится.\n4. Кукурузу откиньте на дуршлаг и рассыпьте поверх ананасов.\n5. Майонезом всё щедро смажьте — и в разогретую духовку.\n6. Запекайте, пока курица полностью не пропечётся, а верх не станет золотистым 🔥"
  approved: true
  notes: "https://www.povarenok.ru/recipes/show/11643/ — соль, перец и масло для смазывания без строк и без количества — можно; курица до полной готовности; разговорный стиль и эмодзи. Одобрить."

# --- отклонённые ---

- id: steps-013
  recipe: "Салат \"Для зайки\"\nМорковь — 400 г\nКапуста белокочанная — 400 г\nЧеснок — 8 зуб.\nСыр твердый — 150 г\nМайонез\nСоль"
  steps: "1. Морковь натрите на мелкой тёрке.\n2. Капусту тонко нашинкуйте, посолите и слегка помните руками, чтобы дала сок.\n3. Сыр натрите на тёрке, все восемь зубчиков чеснока пропустите через пресс.\n4. Соедините морковь, капусту, сыр и чеснок.\n5. Заправьте майонезом и перемешайте.\n6. Перед подачей посыпьте мелко рубленной зеленью."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/53298/ — лишний ингредиент: зелени в строках нет. Остальное верно — отклонить."

- id: steps-014
  recipe: "Куриные нагетсы\nФиле куриное — 2 шт\nСыр твердый — 200 г\nСухари панировочные\nЯйцо куриное — 2 шт\nКунжут"
  steps: "1. Филе порежьте полосками.\n2. Два яйца взбейте вилкой, сыр натрите на мелкой тёрке.\n3. Сухари смешайте с кунжутом.\n4. Каждую полоску окуните в яйцо, обваляйте в сыре, потом в сухарях с кунжутом.\n5. Разогрейте на сковороде 4 ст. л. растительного масла.\n6. Жарьте нагетсы со всех сторон до золотистой корочки и полной готовности внутри 🍗"
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/48243/ — масла в строках нет: для жарки его можно взять только без количества, а «4 ст. л.» выдуманы. Остальное верно — отклонить."

- id: steps-015
  recipe: "Печенье \"Свиные ушки\"\nСахар — 1 стак.\nЯйцо куриное — 3 шт\nСода — 0,5 ч. л.\nМука пшеничная — 1 стак."
  steps: "1. Пару яиц взбейте со стаканом сахара до светлой пышной массы.\n2. Добавьте полчайной ложки соды.\n3. Постепенно вмешайте стакан муки — тесто получится густым.\n4. Противень смажьте маслом и выкладывайте тесто ложкой, придавая печенью форму ушек.\n5. Выпекайте в разогретой духовке до золотистых краёв."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/60103/ — количество против строки: «пару яиц» — это 2, а в строке «Яйцо куриное — 3 шт». Остальное верно — отклонить."

- id: steps-016
  recipe: "Суп-пюре из кабачка и авокадо\nКабачок — 1 шт\nАвокадо — 1 шт\nВода — 1 л\nСыр сливочный — 2 ст. л.\nСоль — по вкусу\nПриправа — по вкусу"
  steps: "1. Кабачок очистите и нарежьте кубиками.\n2. Залейте его литром воды, доведите до кипения и варите, пока кабачок не станет мягким.\n3. Авокадо разрежьте, удалите косточку и выньте мякоть ложкой.\n4. Добавьте в кастрюлю авокадо и 4 ст. л. сливочного сыра.\n5. Пробейте всё блендером до однородности, посолите и добавьте приправу по вкусу.\n6. Прогрейте, не доводя до кипения, и разлейте по тарелкам."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/114030/ — количество против строки: «4 ст. л. сливочного сыра», а в строке «2 ст. л.». Остальное верно — отклонить."

- id: steps-017
  recipe: "Компот из черники\nЧерника — 300 г\nСахар — 300 г\nВода — 3 л"
  steps: "1. Чернику переберите и промойте.\n2. Все 3 литра воды доведите до кипения и всыпьте сахар.\n3. Помешайте, пока сахар не растворится.\n4. Высыпьте чернику и варите 5 минут после закипания.\n5. Снимите с огня, накройте крышкой и дайте остыть — цвет будет шикарный 💜\n6. Если любите без ягод, процедите."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/163263/ — выдуманное время: «5 минут» нет ни в названии, ни в строках. Остальное верно — отклонить."

- id: steps-018
  recipe: "Кекс с изюмом\nМука пшеничная — 1 стак.\nЖелток яичный — 5 шт\nСахар — 1/2 стак.\nМасло сливочное — 150 г\nКоньяк — 2 ст. л.\nИзюм — 1/2 стак.\nВанилин"
  steps: "1. Изюм промойте, залейте коньяком и оставьте набухать.\n2. Мягкое сливочное масло разотрите с сахаром добела.\n3. По одному добавьте 5 желтков, каждый раз хорошо взбивая.\n4. Всыпьте ванилин и муку, перемешайте до однородности.\n5. Вмешайте изюм вместе с коньяком.\n6. Переложите тесто в смазанную маслом форму и выпекайте при 180 °C, пока деревянная шпажка не выйдет сухой."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/14762/ — выдуманная температура: «180 °C» нет ни в названии, ни в строках (можно было «в разогретой духовке»). Остальное верно — отклонить."

- id: steps-019
  recipe: "Салат с тунцом\nМорковь — 3 шт\nСыр твердый — 100-200 г\nЯйцо куриное — 3 шт\nЯблоко — 1-2 шт\nКартофель — 3 шт\nТунец — 2 бан.\nМайонез"
  steps: "1. Картофель, морковь и яйца отварите до готовности (яйца — вкрутую), остудите и очистите.\n2. Тунец достаньте из банок и разомните вилкой.\n3. Картофель, морковь и яйца натрите на крупной тёрке, сыр — на мелкой.\n4. Выкладывайте слоями картофель, тунец, морковь и яйца, промазывая каждый слой майонезом.\n5. Сверху посыпьте тёртым сыром."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/32371/ — строка рецепта не использована: «Яблоко — 1-2 шт» нигде нет. Остальное верно — отклонить."

- id: steps-020
  recipe: "Суп-пюре из сельдерея\nСельдерей корневой — 300 г\nКартофель — 1 шт\nЛук репчатый — 1 шт\nМасло оливковое — 50 мл\nКапуста цветная — 100 г\nМолоко кокосовое — 200 мл\nВода — 500 мл"
  steps: "1. Лук мелко порежьте и обжарьте на оливковом масле до мягкости.\n2. Сельдерей и картошку почистите и нарежьте кубиками.\n3. Отправьте их к луку, залейте 500 мл воды и варите, пока овощи не станут совсем мягкими.\n4. Влейте кокосовое молоко и прогрейте, не доводя до бурного кипения.\n5. Пробейте всё блендером до гладкого крем-супа, посолите по вкусу.\n6. Подавайте горячим — бархатный и ароматный 😌"
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/104021/ — строка рецепта не использована: «Капуста цветная — 100 г» нигде нет. Остальное верно — отклонить."

- id: steps-021
  recipe: "Куриное филе под орехово-грибным соусом\nФиле куриное — 2 шт\nГрибы — 300 г\nЛук репчатый — 1 шт\nОрехи грецкие — 1 горст."
  steps: "1. Филе разрежьте вдоль на тонкие пласты, посолите и поперчите.\n2. Обжарьте на масле с двух сторон до румяности, оставив внутри лёгкую розоватость, — так филе останется сочным.\n3. Лук мелко нарежьте, грибы — пластинками и обжарьте их вместе на той же сковороде до золотистого цвета.\n4. Горсть грецких орехов порубите ножом и добавьте к грибам.\n5. Выложите филе на тарелку и полейте орехово-грибным соусом."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/46013/ — опасный шаг: курица «с лёгкой розоватостью» внутри — недожаренная птица. Остальное верно — отклонить."

- id: steps-022
  recipe: "Шарлотка яблочная\nЯйцо куриное — 5 шт\nСахар — 1 стак.\nМука пшеничная — 1 стак.\nСода гашеная уксусом — 1 ч. л.\nЯблоко — 5 шт"
  steps: "1. Пять яиц взбейте со стаканом сахара, пока масса не станет пышной и светлой.\n2. Добавьте чайную ложку гашёной соды и аккуратно вмешайте стакан муки.\n3. Зачерпните ложку сырого теста и попробуйте: оно должно быть приятно сладким 😉\n4. Пять яблок очистите от сердцевины, нарежьте дольками и выложите в смазанную маслом форму.\n5. Залейте яблоки тестом.\n6. Выпекайте в разогретой духовке до золотистой корочки и сухой шпажки."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/111110/ — опасный шаг: пробовать сырое тесто на сырых яйцах. Остальное верно — отклонить."

- id: steps-023
  recipe: "Запеченные фаршированные куриные бедра\nБедро куриное — 4 шт\nМорковь — 2 шт\nЧеснок — 2 зуб.\nСоль\nПерец черный"
  steps: "1. С бёдер аккуратно срежьте кость, сохранив кожу.\n2. Морковь натрите на мелкой тёрке, чеснок пропустите через пресс и смешайте с морковью.\n3. Бёдра посолите и поперчите с обеих сторон, на каждое выложите морковную начинку, сверните и закрепите зубочисткой.\n4. Разогрейте сковороду с растительным маслом и обжарьте рулетики со всех сторон до румяной корочки.\n5. Убавьте огонь, накройте крышкой и жарьте до полной готовности: при проколе сок прозрачный."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/3864/ — противоречие названию: бёдра «Запеченные», а шаги целиком на сковороде, без духовки. Остальное верно — отклонить."

- id: steps-024
  recipe: "Салат из фасоли с копченой курицей\nКурица — 300 г\nФасоль консервированная — 400 г\nЯйцо куриное — 3 шт\nЛук красный — 1 шт"
  steps: "1. Копчёную курицу нарежьте соломкой.\n2. Яйца очистите от скорлупы и нарежьте кубиками.\n3. Затем опустите их в кипящую воду, сварите вкрутую и остудите.\n4. Красный лук нарежьте тонкими полукольцами.\n5. С фасоли слейте жидкость.\n6. Соедините курицу, фасоль, яйца и лук, посолите по вкусу и перемешайте."
  approved: false
  notes: "https://www.povarenok.ru/recipes/show/15861/ — нелепый порядок: сырые яйца нельзя очистить и нарезать кубиками до варки. Остальное верно — отклонить."
