  must_not_include: ["PAPERLESS_YANDEX", "PAPERLESS_GDRIVE"]
  notes: "Почти по теме: интеграции с облачными дисками нет. Искал в docs и src: yandex, google drive, gdrive, dropbox, onedrive, nextcloud, webdav, sftp, rclone, sharepoint, cloud storage — совпадений нет. «google» встречается только в Gmail OAuth и Google Authenticator. Раздел docs/usage.md#the-consumption-directory говорит лишь, что доставка файлов в папку consume — забота пользователя (FTP, Samba)."

