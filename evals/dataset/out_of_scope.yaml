  must_include: []
  must_not_include: []
  notes: "Почти по теме: проверки электронной подписи нет. Искал в docs и src: digital signature, signature, signed, verify…signature, pyhanko, pades, certificate. В docs есть только предупреждение в docs/usage.md#pdf-actions, что поворот и удаление страниц сделают подпись недействительной. В src/paperless/parsers/tesseract.py подписанный PDF лишь пропускает OCR («This file is encrypted and/or signed, OCR is impossible»); подпись не проверяется. Остальные совпадения — HMAC модели классификатора, inspect.signature и SSL-сертификаты почтовых серверов."

