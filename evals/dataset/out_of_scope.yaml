# Кейсы out_of_scope для оценки отказов ассистента по Paperless-ngx v3.4.2.
# Ответа нет ни в документации (docs/*.md, включая changelog.md), ни в исходниках (src/).
# Ожидаемое поведение — честное «не нашёл» (можно с предложением, что посмотреть), без выдумки.
# В notes перечислено, что искалось: регистр не учитывался, «docs» — все docs/*.md вместе с changelog.md.

