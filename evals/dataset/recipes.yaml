  notes: "Первый ответ неверен: во всех трёх рецептах светлое пиво — ингредиент (маринад, бульон, соус). Пользователь поясняет, что нужна закуска, которую подают к пиву. Нужны другие рецепты: гренки, сухарики, куриные крылышки, колбаски, сырные палочки, креветки — без пива в составе. Не подходят ни эти три, ни другие рецепты с пивом в маринаде, кляре, тесте или соусе."
