# promtool test rules alerts_test.yml (make alerts-test, CI): алерт срабатывает,
# когда должен, и молчит, когда всё в порядке. Время в тестах начинается с 0.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'recipes_dependency_errors_total{kind="balance", job="bot"}'
        values: "0 0 1 1"
      - series: 'recipes_requests_total{source="all", status="error", job="bot"}'
        values: "0 1 2 3 4"
      # Сердцебиение каждую минуту: time() - метрика = 0.
      - series: 'recipes_telegram_heartbeat_timestamp_seconds{job="bot"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: CloudRuBalance
        exp_alerts:
          - exp_labels: {severity: critical, kind: balance, job: bot}
            exp_annotations:
              summary: "Кончились рубли на cloud.ru"
              description: "Модель или эмбеддинги отвечают 402/403 «Project not found»: бот не отвечает на вопросы. Пополните баланс — деньги доходят до API примерно за 5 минут."
      - eval_time: 4m
        alertname: AnswerFailures
        exp_alerts:
          - exp_labels: {severity: critical, source: all, status: error, job: bot}
            exp_annotations:
              summary: "Серия сбоев ответа"
              description: "За 10 минут не собрались три ответа и больше: модель, эмбеддинги или Qdrant недоступны. Причина — в логе бота (docker logs recipes-llm-bot-1)."
      # Бот живой — молчим.
      - eval_time: 15m
        alertname: BotSilent
        exp_alerts: []

  - interval: 1m
    input_series:
      # Сердцебиение остановилось на 60 с: через 5 минут — больше 300 с, ещё
      # 5 минут «for» — алерт.
      - series: 'recipes_telegram_heartbeat_timestamp_seconds{job="bot"}'
        values: "0 60 60 60 60 60 60 60 60 60 60 60 60 60"
    alert_rule_test:
      - eval_time: 5m
        alertname: BotSilent
        exp_alerts: []
      - eval_time: 12m
        alertname: BotSilent
        exp_alerts:
          - exp_labels: {severity: critical, job: bot}
            exp_annotations:
              summary: "Бот не отвечает Telegram"
              description: "Больше 5 минут нет ответа Telegram на getMe или Prometheus не видит бота: пользователи не получают ответов."

  - interval: 1m
    # Бота нет вовсе: метрики сердцебиения нет — absent().
    input_series:
      - series: 'recipes_dependency_errors_total{kind="grocy", job="bot"}'
        values: "0 1"
    alert_rule_test:
      - eval_time: 6m
        alertname: BotSilent
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Бот не отвечает Telegram"
              description: "Больше 5 минут нет ответа Telegram на getMe или Prometheus не видит бота: пользователи не получают ответов."
      - eval_time: 2m
        alertname: GrocyDown
        exp_alerts:
          - exp_labels: {severity: warning, kind: grocy, job: bot}
            exp_annotations:
              summary: "Склад Grocy недоступен"
              description: "Бот не смог прочитать склад и ищет по всем рецептам. Проверьте /opt/grocy (docker compose ps)."

  - interval: 1m
    input_series:
      # Диск на 95 % — 10 минут «for», затем алерт.
      - series: 'node_filesystem_avail_bytes{mountpoint="/", fstype="ext4", device="/dev/vda2", job="node"}'
        values: "5x20"
      - series: 'node_filesystem_size_bytes{mountpoint="/", fstype="ext4", device="/dev/vda2", job="node"}'
        values: "100x20"
      # 40 неудачных входов SSH в минуту: 400 за 10 минут.
      - series: 'recipes_ssh_logins_total{result="failed", job="hostlog"}'
        values: "0+40x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: DiskAlmostFull
        exp_alerts: []
      - eval_time: 12m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels: {severity: warning, mountpoint: "/", fstype: ext4, device: /dev/vda2, job: node}
            exp_annotations:
              summary: "Диск сервера занят больше чем на 90 %"
              description: "На / свободно меньше 10 %: скоро Qdrant, Prometheus и логи перестанут писать. Что занимает место — docker system df и du -sh /var/lib/docker/*."
      - eval_time: 12m
        alertname: SshLoginSpike
        exp_alerts:
          - exp_labels: {severity: warning, result: failed, job: hostlog}
            exp_annotations:
              summary: "Всплеск неудачных входов по SSH"
              description: "Больше 300 неудачных входов по SSH за 10 минут: массовый перебор паролей с многих адресов. fail2ban банит каждый после 5 попыток; надёжная защита — вход только по ключу (PasswordAuthentication no)."

  - interval: 1m
    input_series:
      # Обычный фон: 5 в минуту — 50 за 10 минут, молчим; диск на 50 %.
      - series: 'recipes_ssh_logins_total{result="failed", job="hostlog"}'
        values: "0+5x20"
      - series: 'node_filesystem_avail_bytes{mountpoint="/", fstype="ext4", job="node"}'
        values: "50x20"
      - series: 'node_filesystem_size_bytes{mountpoint="/", fstype="ext4", job="node"}'
        values: "100x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: SshLoginSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: DiskAlmostFull
        exp_alerts: []
