# Prometheus стека Recipes LLM (этап 8, F8). Цели — по DNS-именам сервисов
# compose: если сервис не поднят (локально нет бота, на сервере нет HTTP
# API), цели просто нет, а не «упала». Поэтому «бот не отвечает» — правило по
# метрике сердцебиения (alerts.yml), а не по up.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    # Alertmanager — только на сервере (профиль alerts): локально алерты
    # считаются, но в Telegram не уходят.
    - dns_sd_configs:
        - names: [alertmanager]
          type: A
          port: 9093

scrape_configs:
  - job_name: bot
    dns_sd_configs:
      - names: [bot]
        type: A
        port: 9108
  - job_name: api
    dns_sd_configs:
      - names: [assistant]
        type: A
        port: 8080
  # Своя статистика Grafana, в том числе неудачные входы
  # (grafana_authn_authn_failed_login_total).
  - job_name: grafana
    dns_sd_configs:
      - names: [grafana]
        type: A
        port: 3000
  # Сервер: node_exporter в сети хоста на мосту docker0 (профиль host, только
  # на сервере). Имя — из /etc/hosts контейнера (extra_hosts), а DNS SD /etc/hosts
  # не читает: поэтому static_configs. Локально цели нет — она «down».
  - job_name: node
    static_configs:
      - targets: [host.docker.internal:9100]
