[project]
name = "paperless-assistant"
version = "0.1.0"
description = "ИИ-ассистент поддержки для Paperless-ngx: ответы по документации и коду, диагностика, эскалация"
license = "MIT"
authors = [{ name = "Mikhail Zhdanov" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pyyaml>=6.0.3",
    "ruff",
    "types-pyyaml>=6.0.12.20261103",
]

# Проект ставится в .venv как пакет: так версия живёт только здесь,
# а код читает её через importlib.metadata.
[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assistant"
module-root = ""

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Длину строк держит ruff format, длинные строковые литералы он не режет.
    "E501",
    # «Похожие на латиницу символы»: срабатывает на любую кириллицу в строках и комментариях.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
strict = true
files = ["assistant", "tests", "scripts", "evals"]
# Скрипты не пакет: тесты импортируют их как модули верхнего уровня (`import init_env`).
mypy_path = "scripts"
# Плагин понимает модели pydantic: проверяет аргументы конструктора Settings(...) по полям.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." — чтобы тесты импортировали пакет evals из корня репозитория.
pythonpath = ["scripts", "."]
addopts = "-ra --strict-markers"
